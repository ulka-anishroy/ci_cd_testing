name: Python quality and security

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install check dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Check code formatting
        run: |
          mkdir -p logs
          set -o pipefail
          python -m ruff format --check main.py 2>&1 | tee logs/formatting.log

      - name: Run linting
        run: |
          set -o pipefail
          python -m ruff check main.py 2>&1 | tee logs/linting.log

      - name: Run static type checking
        run: |
          set -o pipefail
          python -m pyright main.py 2>&1 | tee logs/type-checking.log

      - name: Run security scan
        run: |
          set -o pipefail
          python -m bandit -q -r main.py 2>&1 | tee logs/security.log

      - name: Run dependency vulnerability scan
        run: |
          set -o pipefail
          python -m pip_audit -r requirements-dev.txt 2>&1 | tee logs/dependency-audit.log

      - name: Upload check log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-check-log
          path: logs/*.log